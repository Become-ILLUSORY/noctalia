name: Package (Arch)

# Builds a ready-to-install Arch package and attaches it to the release, so the
# fork can be installed with a single `pacman -U` instead of running makepkg by
# hand. Dispatch it manually to get a downloadable artifact without tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install tooling
        run: |
          # base-devel covers makepkg, meson, ninja and pkgconf; the rest are
          # this PKGBUILD's makedepends, installed up front so the build is
          # deterministic instead of letting makepkg pull them mid-run.
          pacman -Syu --noconfirm --needed \
            base-devel git sudo namcap \
            nlohmann-json stb wayland-protocols

      - uses: actions/checkout@v6
        with:
          path: noctalia-src

      # makepkg refuses to run as root and containers are root, so hand the
      # build to an unprivileged user, as Arch's packaging docs suggest.
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Build package
        run: |
          set -euo pipefail
          # Build outside the runner workspace: the build user has to own the
          # whole tree, and makepkg writes its artifacts beside the PKGBUILD.
          install -d -o builder -g builder /home/builder/src
          cp -a noctalia-src/. /home/builder/src/
          rm -rf /home/builder/src/.git
          chown -R builder:builder /home/builder/src

          cd /home/builder/src
          sudo -u builder ./packaging/arch/build-package.sh

      - name: Inspect package
        run: |
          set -euo pipefail
          cd /home/builder/src/packaging/arch
          ls -la ./*.pkg.tar.zst
          echo "--- namcap (advisory) ---"
          # Upstream's own package trips the same checks; do not gate on this.
          namcap ./*.pkg.tar.zst || true
          echo "--- contents ---"
          bsdtar -tf ./*.pkg.tar.zst | head -40

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp /home/builder/src/packaging/arch/*.pkg.tar.zst out/
          # Record provenance so the artifact is traceable to a commit.
          cd noctalia-src
          {
            echo "commit:  $(git rev-parse HEAD)"
            echo "ref:     ${GITHUB_REF_NAME}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "base:    upstream $(cat VERSION) + immersive bar tint"
          } > ../out/BUILD-INFO.txt
          cat ../out/BUILD-INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-arch-package
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" out/*.pkg.tar.zst out/BUILD-INFO.txt --clobber
